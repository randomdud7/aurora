name: Build debs + Sileo repo

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Theos
        run: |
          git clone --recursive --shallow-submodules --depth 1 \
            https://github.com/theos/theos.git "$HOME/theos"
          echo "THEOS=$HOME/theos" >> "$GITHUB_ENV"

      - name: Install iOS toolchain
        run: |
          curl -sL https://github.com/L1ghtmann/llvm-project/releases/latest/download/iOSToolchain-x86_64.tar.xz \
            -o /tmp/iostc.tar.xz
          mkdir -p "$THEOS/toolchain"
          tar -xJf /tmp/iostc.tar.xz -C "$THEOS/toolchain/"
          rm -f /tmp/iostc.tar.xz
          "$THEOS/toolchain/linux/iphone/bin/clang" --version | head -1

      - name: Install iOS SDK
        run: |
          "$THEOS/bin/install-sdk" latest

      - name: Build rootful package
        run: make package FINALPACKAGE=1

      - name: Stage rootful deb
        run: |
          mkdir -p output
          cp packages/*.deb output/aurora-rootful.deb
          ls -la output/

      - name: Build roothide package
        continue-on-error: true
        run: |
          DEB=$(ls packages/*.deb | head -n1)
          bash scripts/make_roothide.sh "$DEB" output/aurora-roothide.deb

      - name: Build Sileo repo site
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          mkdir -p site/debs
          cp output/*.deb site/debs/
          if ! command -v dpkg-scanpackages >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq dpkg-dev
          fi
          cd site
          mkdir -p dists/stable/main/binary-iphoneos-arm
          dpkg-scanpackages --multiversion debs /dev/null > dists/stable/main/binary-iphoneos-arm/Packages
          gzip -9n -c dists/stable/main/binary-iphoneos-arm/Packages > dists/stable/main/binary-iphoneos-arm/Packages.gz
          bzip2 -9c dists/stable/main/binary-iphoneos-arm/Packages > dists/stable/main/binary-iphoneos-arm/Packages.bz2
          cd dists/stable
          {
            echo "Origin: Aurora"
            echo "Label: Aurora"
            echo "Suite: stable"
            echo "Version: 1.0"
            echo "Codename: stable"
            echo "Architectures: iphoneos-arm"
            echo "Components: main"
            echo "Description: Aurora - the lock screen, reimagined"
            echo "Date: $(LC_ALL=C date -u '+%a, %d %b %Y %H:%M:%S UTC')"
            echo ""
            echo "MD5Sum:"
            for f in main/binary-iphoneos-arm/Packages main/binary-iphoneos-arm/Packages.gz main/binary-iphoneos-arm/Packages.bz2; do
              echo " $(md5sum "$f" | cut -d' ' -f1) $(stat -c%s "$f") $f"
            done
            echo "SHA1:"
            for f in main/binary-iphoneos-arm/Packages main/binary-iphoneos-arm/Packages.gz main/binary-iphoneos-arm/Packages.bz2; do
              echo " $(sha1sum "$f" | cut -d' ' -f1) $(stat -c%s "$f") $f"
            done
            echo "SHA256:"
            for f in main/binary-iphoneos-arm/Packages main/binary-iphoneos-arm/Packages.gz main/binary-iphoneos-arm/Packages.bz2; do
              echo " $(sha256sum "$f" | cut -d' ' -f1) $(stat -c%s "$f") $f"
            done
          } > Release
          # Mirror metadata so EVERY suite style Sileo probes returns 200:
          # "./" suite -> dists/Release + dists/main/..., flat repos -> root Packages*
          cp dists/stable/Release dists/Release
          cp -r dists/stable/main dists/main
          cp dists/stable/main/binary-iphoneos-arm/Packages Packages
          cp dists/stable/main/binary-iphoneos-arm/Packages.gz Packages.gz
          cp dists/stable/main/binary-iphoneos-arm/Packages.bz2 Packages.bz2
          cd "$GITHUB_WORKSPACE"
          cat > site/index.html <<'HTML'
          <!doctype html>
          <html>
          <head><meta charset="utf-8"><title>Aurora Repo</title></head>
          <body style="font-family:-apple-system,sans-serif;max-width:40rem;margin:4rem auto;padding:0 1rem;background:#0b0b14;color:#eaeaf0">
          <h1>Aurora Repo</h1>
          <p>Add this URL as a source in Sileo:</p>
          <p><code>https://randomdud7.github.io/aurora/</code></p>
          <p>Sileo &rarr; Sources &rarr; Edit &rarr; Add &rarr; enter the URL &rarr; then search for <b>Aurora</b>.</p>
          </body>
          </html>
          HTML

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: aurora-debs
          path: output/

      - name: Publish rolling "Latest build" release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest build
          body: |
            Auto-built from `main` (commit ${{ github.sha }}).
            Packages attached — see the README for install steps.
          files: output/*.deb
          fail_on_unmatched_files: false
          overwrite_files: true
          make_latest: "true"

      - name: Setup Pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages site
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy Pages site
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/deploy-pages@v4

      - name: Attach debs to versioned GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: output/*.deb
          fail_on_unmatched_files: false
