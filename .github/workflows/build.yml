name: Build debs + Sileo repo

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Theos
        run: |
          git clone --recursive --shallow-submodules --depth 1 \
            https://github.com/theos/theos.git "$HOME/theos"
          echo "THEOS=$HOME/theos" >> "$GITHUB_ENV"

      - name: Install iOS toolchain
        run: |
          curl -sL https://github.com/L1ghtmann/llvm-project/releases/latest/download/iOSToolchain-x86_64.tar.xz \
            -o /tmp/iostc.tar.xz
          mkdir -p "$THEOS/toolchain"
          tar -xJf /tmp/iostc.tar.xz -C "$THEOS/toolchain/"
          rm -f /tmp/iostc.tar.xz
          "$THEOS/toolchain/linux/iphone/bin/clang" --version | head -1

      - name: Install iOS SDK
        run: |
          "$THEOS/bin/install-sdk" latest

      - name: Build rootful package
        run: make package FINALPACKAGE=1

      - name: Stage rootful deb
        run: |
          mkdir -p output
          cp packages/*.deb output/aurora-rootful.deb
          ls -la output/

      - name: Build roothide package
        continue-on-error: true
        run: |
          DEB=$(ls packages/*.deb | head -n1)
          bash scripts/make_roothide.sh "$DEB" output/aurora-roothide.deb

      - name: Build Sileo repo site
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          mkdir -p site/debs
          cp output/*.deb site/debs/
          # Serve raw files (no Jekyll processing) + give Sileo a source icon
          echo "# disable Jekyll processing" > site/.nojekyll
          cp banner.png site/RepoIcon.png 2>/dev/null || true
          if ! command -v dpkg-scanpackages >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq dpkg-dev
          fi
          cd site
          mkdir -p dists/stable/main/binary-iphoneos-arm
          dpkg-scanpackages --multiversion debs /dev/null > Packages
          gzip -9n -c Packages > Packages.gz
          bzip2 -9c Packages > Packages.bz2
          cp Packages Packages.gz Packages.bz2 dists/stable/main/binary-iphoneos-arm/
          cp -r dists/stable/main dists/main
          # gen_release SUITE PREFIX: emit ./Release (in the CURRENT dir) with
          # checksums for Packages{,.gz,.bz2} located under PREFIX (relative to
          # cwd). The caller must cd to the base dir the Release belongs to.
          # PREFIX="" = FLAT repo layout at the site root, exactly like
          # roothide.github.io. When Sileo adds a source it defaults to the
          # "./" dist and fetches {url}/Release FIRST — a missing root Release
          # was the cause of "Release returned status 404".
          gen_release() {
            local suite="$1" prefix="$2" f p algo h
            {
              echo "Origin: Aurora"
              echo "Label: Aurora"
              echo "Suite: $suite"
              echo "Version: 1.0"
              echo "Codename: aurora"
              echo "Architectures: iphoneos-arm iphoneos-arm64 iphoneos-arm64e"
              echo "Components: main"
              echo "Description: Aurora - the lock screen, reimagined"
              echo "Icon: https://randomdud7.github.io/aurora/RepoIcon.png"
              echo "Date: $(LC_ALL=C date -u '+%a, %d %b %Y %H:%M:%S UTC')"
              echo ""
              for algo in MD5Sum SHA1 SHA256; do
                echo "$algo:"
                for f in Packages Packages.gz Packages.bz2; do
                  p="${prefix:+$prefix/}$f"
                  case "$algo" in
                    MD5Sum) h=$(md5sum "$p" | cut -d' ' -f1) ;;
                    SHA1) h=$(sha1sum "$p" | cut -d' ' -f1) ;;
                    SHA256) h=$(sha256sum "$p" | cut -d' ' -f1) ;;
                  esac
                  echo " $h $(stat -c%s "$p") $p"
                done
              done
            } > Release
          }
          # Root FLAT Release — Sileo's default "./" dist fetches {url}/Release
          # first; this file was missing and caused "Release returned status 404".
          gen_release flat ""
          # Nested dists for tools that use a named suite explicitly
          ( cd dists/stable && gen_release stable main/binary-iphoneos-arm )
          ( cd dists && gen_release stable main/binary-iphoneos-arm )
          cd "$GITHUB_WORKSPACE"
          cat > site/index.html <<'HTML'
          <!doctype html>
          <html>
          <head><meta charset="utf-8"><title>Aurora Repo</title></head>
          <body style="font-family:-apple-system,sans-serif;max-width:40rem;margin:4rem auto;padding:0 1rem;background:#0b0b14;color:#eaeaf0">
          <h1>Aurora Repo</h1>
          <p>Add this URL as a source in Sileo:</p>
          <p><code>https://randomdud7.github.io/aurora/</code></p>
          <p>Sileo &rarr; Sources &rarr; Edit &rarr; Add &rarr; enter the URL &rarr; then search for <b>Aurora</b>.</p>
          </body>
          </html>
          HTML

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: aurora-debs
          path: output/

      - name: Publish rolling "Latest build" release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest build
          body: |
            Auto-built from `main` (commit ${{ github.sha }}).
            Packages attached — see the README for install steps.
          files: output/*.deb
          fail_on_unmatched_files: false
          overwrite_files: true
          make_latest: "true"

      - name: Setup Pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages site
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy Pages site
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/deploy-pages@v4

      - name: Attach debs to versioned GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: output/*.deb
          fail_on_unmatched_files: false
